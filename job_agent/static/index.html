<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Job Agent</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230f766e'/%3E%3Cpath d='M10 12h12v11H10z' fill='none' stroke='white' stroke-width='2.2' stroke-linejoin='round'/%3E%3Cpath d='M13 12V9.5h6V12' fill='none' stroke='white' stroke-width='2.2'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="logo" aria-hidden="true"></span>
      <span>Job Agent</span>
    </div>
    <nav class="tabs" aria-label="Sections">
      <a href="#dashboard" data-view="dashboard">Dashboard</a>
      <a href="#jobs" data-view="jobs">Jobs</a>
      <a href="#runs" data-view="runs">Runs</a>
      <a href="#settings" data-view="settings">Settings</a>
    </nav>
    <div class="actions">
      <span id="run-status" class="pill">Idle</span>
      <button id="run-now" class="btn primary" type="button">Run search now</button>
    </div>
  </header>

  <main id="view" tabindex="-1"></main>

  <aside id="drawer" class="drawer" aria-hidden="true">
    <div class="drawer-backdrop" data-close></div>
    <div class="drawer-panel" role="dialog" aria-modal="true" aria-labelledby="drawer-title">
      <button class="icon-btn drawer-close" type="button" data-close aria-label="Close">&times;</button>
      <div id="drawer-body"></div>
    </div>
  </aside>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script src="/static/app.js"></script>
</body>
</html>
